<VirtualHost *:80>
    ServerName qisutu.example.local

    DocumentRoot "/opt/qisutu/bin/cgi-bin"
    DirectoryIndex index.pl

    Alias /static/ "/opt/qisutu/var/static/"

    <Directory "/opt/qisutu/var/static/">
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    <Directory "/opt/qisutu/bin/cgi-bin/">
        Options +ExecCGI -Indexes
        AllowOverride None
        AddHandler cgi-script .pl
        DirectoryIndex index.pl
        Require all granted
        SetEnv QISUTU_HOME /opt/qisutu
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/qisutu-error.log
    CustomLog ${APACHE_LOG_DIR}/qisutu-access.log combined
</VirtualHost>
